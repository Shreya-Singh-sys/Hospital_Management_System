{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 90vh;">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5">
            
            <div class="card glass-card">
                <div class="auth-header">
                    <div class="auth-icon">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Enter your details to sign in</p>
                </div>
                
                <div class="card-body px-4 pb-5 pt-0">
                    <form method="POST" action="{{ url_for('login') }}">
                        
                        <div class="mb-4">
                            <label class="form-label">Select Role</label>
                            <select class="form-select" name="role_select_dummy">
                                <option value="admin">Admin</option>
                                <option value="patient">Patient</option>
                                <option value="doctor">Doctor</option>
                                
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="e.g. user123" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-gradient shadow-sm">LOG IN</button>
                        </div>

                        <div class="text-center mt-4">
                            <p class="text-muted small mb-0">Don't have an account?</p> 
                            <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none" style="color: #6f42c1;">Create Account</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
{% endblock %}
